trigger:
  branches:
    include:
      - with-acctests/**
      - dependabot/**

pr: none

variables:
  LinuxContainerImage: mcr.microsoft.com/onebranch/azurelinux/build:3.0

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    featureFlags:
      golang:
        internalModuleProxy:
          enabled: true

    stages:
      - template: /.azdo/ci.yml@self
